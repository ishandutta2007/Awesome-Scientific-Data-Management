<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#34d399;#818cf8;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399;#818cf8;#38bdf8;#34d399" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#38bdf8;#34d399;#a78bfa" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="dnaGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="dnaGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" opacity="0.6" />
      <circle cx="40" cy="40" r="1.5" fill="#334155" opacity="0.4" />
    </pattern>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 52px; letter-spacing: -0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; letter-spacing: 0.5px; }
    .tagline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; fill: #06b6d4; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .floating-pill { animation: float 5s ease-in-out infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Animated Glowing Orbs -->
  <circle cx="950" cy="180" r="150" fill="#0284c7" opacity="0.25" filter="url(#glow)">
    <animate attributeName="r" values="130;160;130" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;0.35;0.2" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="1100" cy="280" r="120" fill="#10b981" opacity="0.2" filter="url(#glow)">
    <animate attributeName="r" values="100;130;100" dur="7s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.15;0.3;0.15" dur="7s" repeatCount="indefinite" />
  </circle>
  <circle cx="200" cy="100" r="100" fill="#6366f1" opacity="0.15" filter="url(#glow)">
    <animate attributeName="r" values="90;120;90" dur="8s" repeatCount="indefinite" />
  </circle>

  <!-- Data Flow Lines -->
  <g opacity="0.4" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <path d="M 0 320 Q 300 280 600 350 T 1200 300">
      <animate attributeName="d" 
        values="M 0 320 Q 300 280 600 350 T 1200 300; M 0 300 Q 300 350 600 290 T 1200 330; M 0 320 Q 300 280 600 350 T 1200 300" 
        dur="10s" repeatCount="indefinite" />
    </path>
    <path d="M 0 350 Q 400 380 800 320 T 1200 360" stroke="#34d399" stroke-width="1.2" opacity="0.5">
      <animate attributeName="d" 
        values="M 0 350 Q 400 380 800 320 T 1200 360; M 0 360 Q 400 310 800 370 T 1200 340; M 0 350 Q 400 380 800 320 T 1200 360" 
        dur="12s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Dynamic Scientific DNA Helix Illustration (Right Side) -->
  <g transform="translate(880, 70)">
    <!-- Base Pairs & Nodes -->
    <g stroke="#475569" stroke-width="2" opacity="0.7">
      <line x1="50" y1="20" x2="190" y2="40"><animate attributeName="x1" values="50;190;50" dur="4s" repeatCount="indefinite"/><animate attributeName="x2" values="190;50;190" dur="4s" repeatCount="indefinite"/></line>
      <line x1="60" y1="60" x2="180" y2="70"><animate attributeName="x1" values="60;180;60" dur="4s" begin="-0.5s" repeatCount="indefinite"/><animate attributeName="x2" values="180;60;180" dur="4s" begin="-0.5s" repeatCount="indefinite"/></line>
      <line x1="80" y1="100" x2="160" y2="105"><animate attributeName="x1" values="80;160;80" dur="4s" begin="-1.0s" repeatCount="indefinite"/><animate attributeName="x2" values="160;80;160" dur="4s" begin="-1.0s" repeatCount="indefinite"/></line>
      <line x1="110" y1="140" x2="130" y2="140"><animate attributeName="x1" values="110;130;110" dur="4s" begin="-1.5s" repeatCount="indefinite"/><animate attributeName="x2" values="130;110;130" dur="4s" begin="-1.5s" repeatCount="indefinite"/></line>
      <line x1="80" y1="180" x2="160" y2="175"><animate attributeName="x1" values="160;80;160" dur="4s" begin="-2.0s" repeatCount="indefinite"/><animate attributeName="x2" values="80;160;80" dur="4s" begin="-2.0s" repeatCount="indefinite"/></line>
      <line x1="60" y1="220" x2="180" y2="210"><animate attributeName="x1" values="180;60;180" dur="4s" begin="-2.5s" repeatCount="indefinite"/><animate attributeName="x2" values="60;180;60" dur="4s" begin="-2.5s" repeatCount="indefinite"/></line>
      <line x1="50" y1="260" x2="190" y2="240"><animate attributeName="x1" values="190;50;190" dur="4s" begin="-3.0s" repeatCount="indefinite"/><animate attributeName="x2" values="50;190;50" dur="4s" begin="-3.0s" repeatCount="indefinite"/></line>
    </g>

    <!-- Strand 1 Nodes -->
    <circle cx="50" cy="20" r="7" fill="url(#dnaGrad1)" filter="url(#glow)"><animate attributeName="cx" values="50;190;50" dur="4s" repeatCount="indefinite"/><animate attributeName="r" values="7;5;7" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="60" r="6.5" fill="url(#dnaGrad1)"><animate attributeName="cx" values="60;180;60" dur="4s" begin="-0.5s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="100" r="6" fill="url(#dnaGrad1)"><animate attributeName="cx" values="80;160;80" dur="4s" begin="-1.0s" repeatCount="indefinite"/></circle>
    <circle cx="110" cy="140" r="5.5" fill="url(#dnaGrad1)"><animate attributeName="cx" values="110;130;110" dur="4s" begin="-1.5s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="180" r="6" fill="url(#dnaGrad1)"><animate attributeName="cx" values="160;80;160" dur="4s" begin="-2.0s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="220" r="6.5" fill="url(#dnaGrad1)"><animate attributeName="cx" values="180;60;180" dur="4s" begin="-2.5s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="260" r="7" fill="url(#dnaGrad1)" filter="url(#glow)"><animate attributeName="cx" values="190;50;190" dur="4s" begin="-3.0s" repeatCount="indefinite"/></circle>

    <!-- Strand 2 Nodes -->
    <circle cx="190" cy="40" r="6" fill="url(#dnaGrad2)"><animate attributeName="cx" values="190;50;190" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="70" r="6" fill="url(#dnaGrad2)"><animate attributeName="cx" values="180;60;180" dur="4s" begin="-0.5s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="105" r="6.5" fill="url(#dnaGrad2)"><animate attributeName="cx" values="160;80;160" dur="4s" begin="-1.0s" repeatCount="indefinite"/></circle>
    <circle cx="130" cy="140" r="7" fill="url(#dnaGrad2)" filter="url(#glow)"><animate attributeName="cx" values="130;110;130" dur="4s" begin="-1.5s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="175" r="6.5" fill="url(#dnaGrad2)"><animate attributeName="cx" values="80;160;80" dur="4s" begin="-2.0s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="210" r="6" fill="url(#dnaGrad2)"><animate attributeName="cx" values="60;180;60" dur="4s" begin="-2.5s" repeatCount="indefinite"/></circle>
    <circle cx="50" cy="240" r="6" fill="url(#dnaGrad2)"><animate attributeName="cx" values="50;190;50" dur="4s" begin="-3.0s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Content Elements (Left Side) -->
  <g transform="translate(80, 80)">
    <!-- Category Pill -->
    <g class="floating-pill">
      <rect x="0" y="0" width="310" height="32" rx="16" fill="#0f2942" stroke="#0284c7" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="16" r="5" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21" class="tagline">🧬 Curated Research Informatics</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="92" class="title" fill="url(#textGrad)">Awesome Scientific</text>
    <text x="0" y="148" class="title" fill="url(#textGrad)">Data Management</text>

    <!-- Subtitle -->
    <text x="0" y="195" class="subtitle">The definitive ecosystem guide to ELN, LIMS, SDMS &amp; FAIR Platforms</text>

    <!-- Highlight Badges -->
    <g transform="translate(0, 225)">
      <!-- Badge 1: SaaS Leaders -->
      <g>
        <rect x="0" y="0" width="160" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="14" y="22" class="badge-text">⚡ SaaS Leaders</text>
      </g>
      <!-- Badge 2: Open Source -->
      <g transform="translate(175, 0)">
        <rect x="0" y="0" width="160" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="14" y="22" class="badge-text">🔓 Open-Source Hub</text>
      </g>
      <!-- Badge 3: FAIR Principles -->
      <g transform="translate(350, 0)">
        <rect x="0" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="14" y="22" class="badge-text">🧪 FAIR Data Standards</text>
      </g>
      <!-- Badge 4: Pricing Transparency -->
      <g transform="translate(530, 0)">
        <rect x="0" y="0" width="165" height="34" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1.2" />
        <text x="14" y="22" class="badge-text" fill="#6ee7b7">💎 Transparent Pricing</text>
      </g>
    </g>
  </g>

  <!-- Frame Border Subtle Glow -->
  <rect x="1" y="1" width="1198" height="398" rx="8" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6" />
</svg>
